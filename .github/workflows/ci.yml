name: CI and container delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and verify container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pricer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run unit tests in the deployment image
        run: >-
          docker run --rm
          -e LITELLM_LOCAL_MODEL_COST_MAP=True
          pricer:test python -m unittest discover -s tests -v
      - name: Verify API startup and authentication
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs pricer-smoke; docker rm -f pricer-smoke' EXIT
          docker run -d --name pricer-smoke -p 127.0.0.1:8000:8000 \
            -e LITELLM_LOCAL_MODEL_COST_MAP=True \
            -e PRICER_API_KEY=ci-smoke-test-only pricer:test
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused \
            --max-time 5 http://127.0.0.1:8000/health
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 5 http://127.0.0.1:8000/opportunities)
          test "$status" = 401

  publish:
    name: Publish verified image
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase registry path
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
      - name: Record deployable image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "Deployable image - \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
