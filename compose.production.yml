services:
  api:
    image: ${PRICER_IMAGE:?Set PRICER_IMAGE to a published image digest}
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ${PRICER_DEPLOY_DIR:?Set PRICER_DEPLOY_DIR}/.env
    environment:
      PRICER_API_KEY: ${PRICER_API_KEY:?Set a nonempty API key in the deployment .env}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ${PRICER_DEPLOY_DIR}/artifacts:/app/artifacts
      - ${PRICER_DEPLOY_DIR}/products_vectorstore:/app/products_vectorstore
      - ${PRICER_DEPLOY_DIR}/products_bm25.sqlite3:/app/products_bm25.sqlite3:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 6
