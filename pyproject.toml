[project]
name = "pricerproject"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.0",
    "ipywidgets>=8.1.8",
    "joblib>=1.5.3",
    "jupyterlab>=4.6.2",
    "litellm>=1.95.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "plotly>=6.9.0",
    "pydantic>=2.13.4",
    "peft>=0.18.0",
    "pillow>=12.0.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "transformers>=5.14.1",
    "trl>=0.29.0",
    "xgboost>=3.4.0",
    "wandb>=0.28.1",
    "modal>=1.5.3",
    "sentence-transformers>=5.6.1",
    "chromadb>=1.5.9",
    "feedparser>=6.0.14",
    "gradio>=6.22.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
