model_list:
  - model_name: pricer-local
    litellm_params:
      model: os.environ/PRICER_GATEWAY_UPSTREAM_MODEL
      api_base: os.environ/PRICER_GATEWAY_UPSTREAM_API_BASE
      api_key: os.environ/PRICER_GATEWAY_UPSTREAM_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true
  request_timeout: 120
  set_verbose: false

router_settings:
  num_retries: 2
